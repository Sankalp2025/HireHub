name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hirehub
          POSTGRES_PASSWORD: hirehub_dev
          POSTGRES_DB: hirehub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hirehub -d hirehub_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://hirehub:hirehub_dev@localhost:5432/hirehub_test
      SECRET_KEY: ci-test-secret-key
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "60"
      ENVIRONMENT: test
      BACKEND_CORS_ORIGINS: '["http://localhost:5173"]'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Lint
        run: cd backend && ruff check .

      - name: Test
        run: cd backend && pytest tests/
